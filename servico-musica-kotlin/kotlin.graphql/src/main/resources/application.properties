spring.application.name=kotlin.graphql
server.port=8087

spring.datasource.url=jdbc:h2:mem:musicasdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=banco
spring.datasource.password=senha

spring.jpa.hibernate.ddl-auto=create-drop

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.graphql.graphiql.enabled=true
spring.graphql.http.path=/servico-graphql-kotlin

spring.graphql.schema.inspection.enabled=true